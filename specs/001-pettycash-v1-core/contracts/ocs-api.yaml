                  items: { type: array, items: { $ref: '#/components/schemas/SheetSummary' } }
    TransactionPage:
      description: Paged transaction summaries
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TransactionSummary' } }
    SeniorSheetQueue:
      description: Paged senior-scoped Cost Sheet summaries, including completed sheets
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SeniorSheetQueueItem' } }
    AuditPage:
      description: Paged audit events
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
    FinanceHolderPage:
      description: Paged petty-cash holders (Feature 008)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HolderSummary' } }
    FinanceHolderAccountPage:
      description: Paged Finance-scoped holder accounts, active and inactive (Feature 008)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                required: [holder]
                properties:
                  holder: { $ref: '#/components/schemas/FinanceUserRef' }
                  items: { type: array, items: { $ref: '#/components/schemas/HolderAccountSummary' } }
    FinanceLedgerPage:
      description: Paged authoritative ledger rows for one holder account (Feature 008)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                required: [account]
                properties:
                  account: { $ref: '#/components/schemas/HolderAccountSummary' }
                  items: { type: array, items: { $ref: '#/components/schemas/FinanceLedgerRow' } }
    CompletedSheetPage:
      description: Paged completed Cost Sheet history entries (Feature 008)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CompletedSheetSummary' } }

  schemas:
    ExpectedVersion:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        # T425 / FR-083 / SC-016. This was `{ type: string }` — **open**, with no list — while the whole
        # design rests on a client branching on the code: FR-085 was decided partly so
        # `SUPERSEDED_ATTEMPT` stays distinguishable from `ACCOUNT_VERSION_CONFLICT`, and T416 added
        # `SHEET_VERSION_CONFLICT` on exactly that reasoning. An open string promises nothing, so a code may be
        # renamed, dropped, or misspelled and this contract stays valid — making a branch on a code never more
        # than a guess, and leaving the HTTP status as the only dependable thing to react to.
        #
        # The enumeration is **closed and complete** by SC-016's two-way rule: every code the application can
        # emit is listed, and no listed code is one it cannot emit. A new code is a **contract change**,
        # shipped deliberately and never ahead of this list.
        #
        # The four `CONFIGURATION_*` and bare `*_VERSION_CONFLICT` families are **generated** from a resource
        # noun by `ConfigurationConflict` and `StaleRecordVersion`, so a code that moves between resources changes
        # this list. `ConfigurationMutationAuditTest` and `StaleVersionConflictTest` prove the members reachable;
        # `tests/Contract/Controller/ErrorCodeVocabularyTest.php` proves this list and the application agree in
        # both directions.
        code:
          type: string
          enum:
            - BAD_REQUEST
            - DATA_FAULT
            - FORBIDDEN
            - IDEMPOTENCY_CONFLICT
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - STATE_CONFLICT
            - UNEXPECTED_FAILURE
            - VALIDATION_FAILED
            - ACCOUNT_ALREADY_EXISTS
            - ACCOUNT_NOT_SETTLEABLE
            - ACCOUNT_VERSION_CONFLICT
            - CONFIGURATION_COST_CENTER_ALREADY_EXISTS
            - CONFIGURATION_COST_CENTER_VERSION_CONFLICT
            - CONFIGURATION_CURRENCY_ALREADY_EXISTS
            - CONFIGURATION_CURRENCY_VERSION_CONFLICT
            - CONFIGURATION_EXPENSE_TYPE_ALREADY_EXISTS
            - CONFIGURATION_EXPENSE_TYPE_VERSION_CONFLICT
            - EVIDENCE_LINK_REFUSED
            - NOT_TRANSACTION_OWNER
            - SHEET_VERSION_CONFLICT
            - SUPERSEDED_ATTEMPT
            - TRANSACTION_NOT_AWAITING_CORRECTION
            - TRANSACTION_VERSION_CONFLICT
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        commandId: { type: string, format: uuid, nullable: true }
    ErrorEnvelope:
      # The value every error response carries in `ocs.data`: the `Error` schema under an `error`
      # key. `OcsErrorMapper::respond()` is the single producer, so there is one nesting to keep.
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }
    Money:
      type: object
      required: [amountMinor, currency, minorUnit]
      properties:
        amountMinor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        minorUnit: { type: integer, minimum: 0, maximum: 4 }
    CapabilitySet:
      type: object
      additionalProperties: { type: boolean }
    SessionContext:
      type: object
      required: [userId, displayName, roles, capabilities, costCenterCodes]
      properties:
        userId: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [PURCHASER, COST_CENTER_MANAGER, SENIOR_MANAGER, FINANCE, ADMINISTRATOR] }
        capabilities: { $ref: '#/components/schemas/CapabilitySet' }
        # The cost centres whose transactions and reports this caller is assigned to review
        # (FR-004, FR-005) — the union of their cost-centre-manager and senior-manager assignments
        # that are active on the date of the request. Empty for anybody with no such assignment,
        # **including an administrator**: FR-007 gives an administrator visibility without decision
        # authority, and visibility is a server-side rule, so this is a scope, not a grant.
        #
        # A member of `SessionContext`, not of `capabilities`, because `CapabilitySet` is
        # `additionalProperties: {type: boolean}` and a list of strings would violate it. Codes
        # rather than public ids because this is the vocabulary the server's own authorization
        # uses (`ManagementReviewService::getManagedCostCenterCodes()`) and the one the transaction
        # rows carry as `EntitySnapshot.code`, so the client and the server cannot disagree about
        # what identifies a cost centre (T336).
        costCenterCodes:
          type: array
          items: { type: string }
    Dashboard:
      type: object
      properties:
        purchaser: { type: object, additionalProperties: true }
        costCenter: { type: object, additionalProperties: true }
        senior: { type: object, additionalProperties: true }
        finance: { type: object, additionalProperties: true }
        admin: { type: object, additionalProperties: true }
    CurrencyWrite:
      type: object
      required: [code, name, minorUnit, active]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        minorUnit: { type: integer, minimum: 0, maximum: 4 }
        active: { type: boolean }
    Currency:
      allOf:
        - $ref: '#/components/schemas/CurrencyWrite'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    CostCenterWrite:
      type: object
      required: [code, name, validFrom, active, managerUserId, seniorManagerUserId]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
        active: { type: boolean }
        managerUserId: { type: string }
        seniorManagerUserId: { type: string }
        changeReason: { type: string, minLength: 1 }
    CostCenter:
      allOf:
        - $ref: '#/components/schemas/CostCenterWrite'
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
    ExpenseTypeWrite:
      type: object
      required: [title, evidenceRequired, active]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        evidenceRequired: { type: boolean }
        active: { type: boolean }
        changeReason: { type: string, minLength: 1 }
    ExpenseType:
      allOf:
        - $ref: '#/components/schemas/ExpenseTypeWrite'
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
    FinanceAssignmentWrite:
      type: object
      required: [userId, validFrom, active, changeReason]
      properties:
        userId: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
        active: { type: boolean }
        changeReason: { type: string, minLength: 1 }
    RoleAssignment:
      allOf:
        - $ref: '#/components/schemas/FinanceAssignmentWrite'
        - type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            role: { type: string, enum: [FINANCE] }
    AccountCreate:
      type: object
      required: [userId, currency]
      properties:
        userId: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Account:
      type: object
      required: [id, userId, balance, active, version]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        balance: { $ref: '#/components/schemas/Money' }
        active: { type: boolean }
        version: { type: integer }
    AccountCharge:
      type: object
      required: [amountMinor, description, occurredAt, expectedVersion]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        occurredAt: { type: string, format: date-time }
        expectedVersion: { type: integer, minimum: 0 }
    AccountActiveUpdate:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        explanation: { type: string, maxLength: 1000, nullable: true }
    Movement:
      type: object
      required: [id, type, amount, balanceAfter, occurredAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [CHARGE, CONSUMPTION] }
        amount: { $ref: '#/components/schemas/Money' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        sourceRevisionId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }
    AccountMutationResult:
      type: object
      required: [account, movement]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        movement: { $ref: '#/components/schemas/Movement' }
    # ---------------------------------------------------------------------------
    # Feature 008 — Finance Manager Account Management projection schemas.
    # Read-only projections over existing authoritative records; no schema
    # carries a mutation capability, and no field is client-derivable (FR-008-051).
    # ---------------------------------------------------------------------------
    FinanceUserRef:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string }
        displayName: { type: string }
    HolderSummary:
      type: object
      required: [userId, displayName, accountCount, activeAccountCount, status]
      properties:
        userId: { type: string }
        displayName:
          type: string
          description: Resolved server-side only for account-owning uids; falls back to the uid
        accountCount: { type: integer, minimum: 1 }
        activeAccountCount: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MIXED]
          description: >-
            Derived from the holder's accounts only: ACTIVE = every account
            active, INACTIVE = none active, MIXED = both.
    HolderAccountSummary:
      type: object
      required: [id, userId, currency, minorUnit, balance, active, version, movementCount, lastMovementAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        minorUnit: { type: integer, minimum: 0, maximum: 4 }
        balance: { $ref: '#/components/schemas/Money' }
        active: { type: boolean }
        version:
          type: integer
          minimum: 0
          description: Optimistic-lock value the existing recharge write must send
        movementCount: { type: integer, minimum: 0 }
        lastMovementAt:
          type: string
          format: date-time
          nullable: true
          description: Batched MAX(occurred_at); null for an unused account
    FinanceSheetRef:
      type: object
      required: [id, reference, title]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          format: uuid
          description: The authoritative public sheet UUID; no other reference format exists
        title: { type: string }
    ApprovalCounts:
      type: object
      required: [approvedCount, totalCount]
      properties:
        approvedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
    FinanceLedgerRow:
      type: object
      required: [id, type, occurredAt, description, sheet, approved, recharge, expense, balanceAfter, sourceRevisionId]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [CHARGE, CONSUMPTION]
          description: Movement semantics/styling, not a user-visible column
        occurredAt:
          type: string
          format: date-time
          description: >-
            The authoritative persisted movement posting timestamp (the ledger
            Date). Never the Cost Sheet creation date, the transaction expense
            date, or any other substituted date (FR-008-014).
        description:
          type: string
          description: >-
            Consumption: the resolved Cost Sheet title (the sheet reference
            travels in `sheet`). Charge: the stored charge description
            (FR-008-015).
        sheet:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FinanceSheetRef'
          description: The originating Cost Sheet; null for a charge
        approved:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApprovalCounts'
          description: >-
            The Cost Sheet's approved transaction count relative to its total
            for a consumption; null for a recharge (rendered as not
            applicable). There is no rejected-count field (FR-008-016/017/020).
        recharge:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The recharge amount; non-null only when `type` is CHARGE (FR-008-018)
        expense:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The expense amount; non-null only when `type` is CONSUMPTION (FR-008-018)
        balanceAfter:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            The authoritative persisted resulting balance for this movement;
            the client never derives a balance from the page
            (FR-008-019/023/024).
        sourceRevisionId:
          type: string
          format: uuid
          nullable: true
          description: The consumption revision link; null for a charge
    CompletedSheetSummary:
      type: object
      required: [id, reference, title, purchaser, totalTransactionCount, approvedTransactionCount, rejectedTransactionCount, postedAmount, postingCount, completedAt, status]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          format: uuid
          description: The authoritative public sheet UUID; no other reference format exists
        title: { type: string }
        purchaser: { $ref: '#/components/schemas/FinanceUserRef' }
        totalTransactionCount: { type: integer, minimum: 0 }
        approvedTransactionCount: { type: integer, minimum: 0 }
        rejectedTransactionCount: { type: integer, minimum: 0 }
        postedAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            The sum of the consumption movements actually linked to the sheet —
            never a projection assuming every approved transaction posted
            (FR-008-035).
        postingCount: { type: integer, minimum: 0 }
        completedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [COMPLETED, COMPLETED_WITH_REJECTIONS]
          description: >-
            Terminal completed states only; a sheet with any pending Finance
            decision is never listed (FR-008-032/036).
    FinancePosting:
      type: object
      required: [occurredAt, amount, balanceAfter]
      properties:
        occurredAt:
          type: string
          format: date-time
          description: The accounting posting timestamp; distinct from the expense date
        amount: { $ref: '#/components/schemas/Money' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
    FinanceDecisionStages:
      type: object
      required: [costCenter, senior, finance]
      properties:
        costCenter:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Decision'
        senior:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Decision'
        finance:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Decision'
          description: The final Finance Manager decision; terminal for every listed transaction
    FinanceEvidenceMetadata:
      type: object
      required: [id, name, mediaType, sizeBytes, active, uploadedBy, uploadedAt]
      description: >-
        Metadata only; content is read through GET /evidence/{evidenceId}/content
        under the read-only completed-history authorization documented there
        (FR-008-037). No content, URL, or token is embedded in this schema.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
    CompletedSheetTransaction:
      type: object
      required: [id, reference, revisionNumber, description, expenseDate, amount, finalOutcome, status, decisions, decisionHistory, evidence, posting]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          format: uuid
          description: The transaction public UUID
        revisionNumber: { type: integer, minimum: 1 }
        description: { type: string }
        expenseDate:
          type: string
          format: date
          description: >-
            The business expense date, labelled as such — never presented as
            the posting timestamp.
        amount: { $ref: '#/components/schemas/Money' }
        finalOutcome:
          type: string
          enum: [APPROVED, REJECTED]
        status:
          type: string
          enum: [COMPLETED_APPROVED, COMPLETED_REJECTED]
          description: Terminal only; a pending Finance-review state never appears (FR-008-036)
        decisions: { $ref: '#/components/schemas/FinanceDecisionStages' }
        decisionHistory:
          type: array
          items: { $ref: '#/components/schemas/Decision' }
          description: Full chronological decision history for audit-grade display
        evidence:
          type: array
          items: { $ref: '#/components/schemas/FinanceEvidenceMetadata' }
        posting:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FinancePosting'
          description: The consumption movement actually linked to this transaction's revision; null for a rejected transaction
    CompletedSheetDetail:
      allOf:
        - $ref: '#/components/schemas/CompletedSheetSummary'
        - type: object
          required: [accountId, currency, minorUnit, createdAt, firstSubmittedAt, financeStartedAt, transactions]
          properties:
            accountId: { type: string, format: uuid }
            currency: { type: string, minLength: 3, maxLength: 3 }
            minorUnit: { type: integer, minimum: 0, maximum: 4 }
            createdAt: { type: string, format: date-time }
            firstSubmittedAt:
              type: string
              format: date-time
              nullable: true
            financeStartedAt:
              type: string
              format: date-time
              nullable: true
            transactions:
              type: array
              items: { $ref: '#/components/schemas/CompletedSheetTransaction' }
              description: >-
                Every transaction of the sheet; the detail is served only when
                each of them is terminal (FR-008-034/036). Strictly read-only —
                no capability, decision-form, or mutation field exists
                (FR-008-038).
    SheetStatus:
      type: string
      # The domain's `SheetStatus` values, not the transaction `AWAITING_*` names this list carried
      # before: FR-037 (clarified 2026-10-02) establishes `CORRECTION` as a genuine sheet status over
      # the ranking Draft/CostCenter/Correction/Senior/Finance/Final, and the clarification records
      # that the `AWAITING_*` names are `TransactionStatus` values, not `SheetStatus` ones. The server
      # emits the domain values (a submitted sheet reports `COST_CENTER`), so the old list made every
      # submitted sheet unrepresentable and unassertable — corrected here to match, not the code to it.
      enum: [OPEN, COST_CENTER, CORRECTION, SENIOR, FINANCE, COMPLETED, COMPLETED_WITH_REJECTIONS]
    SheetCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        accountId:
          type: string
          format: uuid
          description: >
            Optional, and its absence is meaningful rather than merely unchecked. FR-020 resolves the
            account for a new sheet from the caller's own active accounts: none means the default rial
            account is provisioned on this attempt and used; exactly one means that account is used
            automatically; several means the caller must send this field and the request is refused
            naming it. A purchaser with zero accounts therefore has no `accountId` to send, which is
            why it cannot be required -- FR-020 and a required `accountId` cannot both hold.
    SheetUpdate:
      # T439 / FR-019 / FR-021. The pre-submission update is **title-only**, so it does not reuse
      # `SheetCreate`: that schema is create-specific (its optional `accountId` selects or provisions
      # the account for a *new* sheet, FR-020) and reusing it declared a field the update must refuse.
      # `additionalProperties: false` makes a supplied `accountId` schema-invalid as well as
      # server-refused, so the two layers cannot drift into disagreement.
      type: object
      additionalProperties: false
      required: [title, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        expectedVersion: { type: integer, minimum: 0 }
      description: >
        A title-only update of an existing open sheet. `expectedVersion` is required so a stale write
        is refused as a conflict instead of silently overwriting a newer one. There is no
        `accountId` property and no FR-020 provisioning semantics: the sheet keeps the account it was
        created with, active or inactive, and its currency. A request body that supplies `accountId`
        is refused with `422 VALIDATION_FAILED` and `fieldErrors.accountId` before persistence; a
        supplied value does not authorize account replacement.
    SheetTotals:
      type: object
      properties:
        current: { $ref: '#/components/schemas/Money' }
        submitted: { $ref: '#/components/schemas/Money' }
        effectiveApproved: { $ref: '#/components/schemas/Money' }
        effectiveRejected: { $ref: '#/components/schemas/Money' }
        effectivePending: { $ref: '#/components/schemas/Money' }
        costCenterApproved: { $ref: '#/components/schemas/Money' }
        seniorApproved: { $ref: '#/components/schemas/Money' }
        financeApproved: { $ref: '#/components/schemas/Money' }
    StageApprovedTotals:
      type: object
      required: [costCenterApproved, seniorApproved, financeApproved]
      properties:
        costCenterApproved: { $ref: '#/components/schemas/Money' }
        seniorApproved: { $ref: '#/components/schemas/Money' }
        financeApproved: { $ref: '#/components/schemas/Money' }
      description: >
        Whole-Cost-Sheet approved monetary totals, one per workflow stage, as the reviewer-facing
        subset of `SheetTotals` (FR-062). Every figure is computed by the server from the sheet's
        **complete** transaction set — the active revision's amount counts toward a stage total only
        when that stage's authoritative decision on the current active revision is Approved; Rejected,
        Returned, undecided, and superseded-revision approvals do not contribute. A Cost Sheet is
        single-currency by domain invariant, so each total is one `Money` in the sheet's own currency:
        there is no conversion and no per-currency array. Zero is a real derived answer, distinct from
        a stage the responding surface cannot prove. Aggregate disclosure only (owner decision,
        2026-11-20): the totals never widen transaction-level visibility, evidence visibility,
        individual decision-history visibility, or any mutation/authorization surface.
    SheetSummary:
      type: object
      required: [id, title, ownerId, currency, status, transactionCount, totals, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        ownerId: { type: string }
        ownerDisplayName: { type: string }
        currency: { type: string }
        status: { $ref: '#/components/schemas/SheetStatus' }
        transactionCount: { type: integer }
        totals: { $ref: '#/components/schemas/SheetTotals' }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        firstExpenseDate: { type: string, format: date, nullable: true }
        lastExpenseDate: { type: string, format: date, nullable: true }
        version: { type: integer }
        activeRevisionNumber:
          type: integer
          minimum: 0
          nullable: true
          description: >
            FR-063's latest active transaction revision number: the highest revision number among the
            active revisions of this sheet's transactions, and 0 when the sheet holds none. Added
            2026-10-06 (T385), because the requirement named "the active transaction revision", which is a
            member of TransactionSummary and therefore one per transaction rather than one per sheet.
    SheetDetail:
      allOf:
        - $ref: '#/components/schemas/SheetSummary'
        - type: object
          required: [accountId]
          properties:
            # T439 / FR-019 / FR-021. The authoritative stored account's public UUID, in the
            # detail-only branch: the Sheets List keeps `SheetSummary` and declares no account. It is
            # the account the sheet was created with -- not the caller's first active account, not a
            # list-order pick, and never the internal database id -- so the edit form can display it
            # read-only instead of guessing it.
            accountId:
              type: string
              format: uuid
              minLength: 1
              description: >
                The public UUID of the account this sheet is stored against. It is a response fact,
                not an update input: `PATCH /sheets/{sheetId}` accepts no `accountId`.
            allowedActions: { $ref: '#/components/schemas/CapabilitySet' }
            transactions:
              type: array
              items: { $ref: '#/components/schemas/TransactionSummary' }
    TransactionStage:
      type: string
      enum: [DRAFT, COST_CENTER, CORRECTION, SENIOR, FINANCE, FINAL]
    TransactionStatus:
      type: string
      enum: [DRAFT, AWAITING_COST_CENTER_REVIEW, COST_CENTER_APPROVED, COST_CENTER_REJECTED, AWAITING_SENIOR_REVIEW, SENIOR_APPROVED, SENIOR_REJECTED, AWAITING_FINANCE_REVIEW, AWAITING_PURCHASER_CORRECTION, COMPLETED_APPROVED, COMPLETED_REJECTED]
    TransactionDraftWrite:
      # FR-089: the create and update operations accept the FR-022 minimum **and** every optional
      # draft field declared below. A save never requires evidence, even when the selected expense
      # type has `evidence_required = true`; that rule is evaluated only at submit/resubmit (FR-091).
      type: object
      required: [expenseDate, amountMinor]
      properties:
        expenseDate: { type: string, format: date }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        description: { type: string, nullable: true }
        costCenterId: { type: string, format: uuid, nullable: true }
        expenseTypeId: { type: string, format: uuid, nullable: true }
    TransactionSummary:
      type: object
      required: [id, sheetId, activeRevision, stage, status, evidenceCount, evidenceRequired, version]
      properties:
        id: { type: string, format: uuid }
        sheetId: { type: string, format: uuid }
        activeRevision: { $ref: '#/components/schemas/Revision' }
        stage: { $ref: '#/components/schemas/TransactionStage' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        finalOutcome: { type: string, enum: [APPROVED, REJECTED], nullable: true }
        latestDecision: { $ref: '#/components/schemas/Decision' }
        evidenceCount: { type: integer }
        # FR-092. Server-derived from the active expense type's **current** `evidence_required`
        # setting, never inferred by the client. False when the transaction has no expense type yet.
        # The readiness surface pairs this with `evidenceCount` to name each draft missing a receipt;
        # the authoritative refusal remains the submit/resubmit 422 (FR-091).
        evidenceRequired: { type: boolean }
        version: { type: integer }
        # Owner decision (2026-11-20): whole-sheet stage-approved aggregate disclosure. Emitted ONLY
        # on `GET /queues/finance` items — the shared-queue finance projection stamps each item with
        # its owning Cost Sheet's whole-sheet aggregate, computed by the server from the sheet's
        # complete transaction set (`SheetTotals`), so every item of one Sheet carries the identical
        # value. It is deliberately absent from cost-center/senior queue items and from owner-facing
        # transaction surfaces (where the sheet summary's `SheetTotals` is the vehicle), and no other
        # per-transaction data — decisions, actors, comments, evidence — is widened to support it.
        stageApprovedTotals: { $ref: '#/components/schemas/StageApprovedTotals' }
        # Owner decision (2026-11-22): owning Cost Sheet metadata, emitted ONLY on `GET /queues/finance`
        # items. The finance queue's transaction-scoped projection previously dropped these values,
        # forcing `Purchaser unavailable` / `Date unavailable` fallbacks; they are reattached here
        # batched by sheet so no per-row lookup is needed. Absent from cost-center/senior queue items
        # and from owner-facing transaction surfaces.
        sheetTitle: { type: string }
        sheetOwnerId: { type: string }
        sheetOwnerDisplayName: { type: string }
        sheetSubmittedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            The genuine first-submission instant (`ExpenseSheet::firstSubmittedAt`), not the sheet's
            creation time and not a later correction's timestamp.
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          properties:
            allowedActions: { $ref: '#/components/schemas/CapabilitySet' }
            decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
            evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
    ManagerSheetSummary:
      type: object
      required: [id, title, ownerId, ownerDisplayName, currency, status, submittedTotalMinor, submittedTotal, submittedAt, version, stageApprovedTotals]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        ownerId: { type: string }
        ownerDisplayName: { type: string }
        currency: { type: string }
        status: { $ref: '#/components/schemas/SheetStatus' }
        submittedTotalMinor:
          type: integer
          format: int64
          nullable: true
          description: >
            The sheet's submission snapshot from `submitted_total_minor`, set once by the domain's
            submit transition. It is the sheet total, not a sum of the manager-scoped transactions
            in this response. Nullable only for a stored record that predates or lacks a submission
            snapshot; the endpoint is reachable through submitted transactions, so normal responses
            carry a value.
        submittedTotal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >
            `submittedTotalMinor` in the contract's currency-safe Money shape. `minorUnit` comes from
            configured currency data, so a client never infers the scale.
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            The genuine first-submission instant (`ExpenseSheet::firstSubmittedAt`), not the sheet's
            creation time and not a later correction's timestamp.
        version: { type: integer }
        # Owner decision (2026-11-20): whole-sheet stage-approved aggregate disclosure. This summary
        # is served only by the per-sheet Cost Center review read, so the aggregate is always
        # present here. It is computed from the sheet's complete transaction set — NOT the
        # manager-scoped subset in `transactions` — and discloses no transaction, actor, comment,
        # evidence, or individual decision outside the manager's scope.
        stageApprovedTotals: { $ref: '#/components/schemas/StageApprovedTotals' }
    ManagerSheetProgress:
      type: object
      required: [awaitingManager, decidedByManager, returnedForCorrection, total, managerComplete]
      properties:
        awaitingManager:
          type: integer
          minimum: 0
          description: Current-revision transactions in the manager's scope still awaiting their decision.
        decidedByManager:
          type: integer
          minimum: 0
          description: Current-revision transactions this manager approved or rejected at cost-centre review.
        returnedForCorrection:
          type: integer
          minimum: 0
          description: Current-revision transactions this manager returned for correction.
        total:
          type: integer
          minimum: 0
          description: Sum of the three manager-scoped counts. It is not the sheet's transaction count.
        managerComplete:
          type: boolean
          description: >
            True only when no manager-scoped transaction awaits this manager. This MUST NOT be read
            as whole-sheet cost-centre completion, and it does not establish Senior eligibility
            (FR-006-047/048).
    ManagerTransactionState:
      type: string
      enum: [AWAITING_MANAGER_DECISION, DECIDED_BY_MANAGER, RETURNED_FOR_CORRECTION]
    ManagerTransactionSummary:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          required: [managerState, managerDecision]
          properties:
            managerState: { $ref: '#/components/schemas/ManagerTransactionState' }
            managerDecision:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Decision'
              description: >
                This manager's cost-centre decision on the transaction's current revision, present
                only for `DECIDED_BY_MANAGER` and `RETURNED_FOR_CORRECTION`. It is not the
                transaction's `latestDecision`, which may belong to a later stage.
    ManagerSheetReview:
      type: object
      required: [sheet, progress, transactions]
      properties:
        sheet: { $ref: '#/components/schemas/ManagerSheetSummary' }
        progress: { $ref: '#/components/schemas/ManagerSheetProgress' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/ManagerTransactionSummary' }
    # Feature 007 backend batch (T026): the additive Senior review schemas, mirroring the
    # Manager* shapes above. Nothing here edits an existing schema; the CC decision surface and the
    # existing public contracts are unchanged (FR-007-051/052).
    SeniorSheetSummary:
      type: object
      required: [id, title, ownerId, ownerDisplayName, currency, status, submittedTotalMinor, submittedTotal, submittedAt, version, allTransactionsCostCenterDecided, reviewStatus]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        ownerId: { type: string }
        ownerDisplayName: { type: string }
        currency: { type: string }
        status: { $ref: '#/components/schemas/SheetStatus' }
        submittedTotalMinor:
          type: integer
          format: int64
          nullable: true
          description: >
            The sheet's submission snapshot from `submitted_total_minor`, set once by the domain's
            submit transition. It is the sheet total, not a sum of the senior-scoped transactions
            in this response.
        submittedTotal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >
            `submittedTotalMinor` in the contract's currency-safe Money shape; `minorUnit` comes
            from configured currency data, so a client never infers the scale.
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: The genuine first-submission instant (`ExpenseSheet::firstSubmittedAt`).
        version: { type: integer }
        allTransactionsCostCenterDecided:
          type: boolean
          nullable: true
          description: >
            The backend-computed, sheet-wide Cost Center completion gate (owner D1, FR-007-013,
            001 FR-037 amendment): `true` only when every transaction on the sheet has a final Cost
            Center decision on its current revision (Approve, Reject, or a Return corrected and
            then re-decided). A pending Return does not satisfy it. `null` when the backend cannot
            prove the gate; a client must never derive eligibility itself.
        reviewStatus:
          type: string
          enum: [PENDING_REVIEW, REVIEW_COMPLETED]
          description: >
            Presentation-only Senior-queue status (owner D5, FR-007-017): `REVIEW_COMPLETED` only
            when the senior-pending set is empty. Completed sheets stay listed, read-only and
            non-actionable. Never the domain `SheetStatus` and never derived client-side.
    SeniorSheetProgress:
      type: object
      required: [awaitingSenior, decidedBySenior, total]
      properties:
        awaitingSenior:
          type: integer
          minimum: 0
          description: Current-revision transactions in the senior's scope awaiting any senior decision.
        decidedBySenior:
          type: integer
          minimum: 0
          description: Current-revision transactions this senior decided (approved, rejected or returned).
        total:
          type: integer
          minimum: 0
          description: Sum of the two senior-scoped counts; not the sheet's transaction count.
    SeniorTransactionState:
      type: string
      enum: [AWAITING_SENIOR_DECISION, DECIDED_BY_SENIOR]
    SeniorTransactionSummary:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          required: [seniorState, seniorDecision]
          properties:
            seniorState: { $ref: '#/components/schemas/SeniorTransactionState' }
            seniorDecision:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Decision'
              description: >
                This senior's decision on the transaction's current revision, present only for
                `DECIDED_BY_SENIOR`. A return by this senior is reported as `DECIDED_BY_SENIOR`
                because it moves the transaction to correction; the two-state vocabulary has no
                separate returned token. The Cost Center decision stays visible through
                `TransactionSummary`/`TransactionDetail` and is never rolled up here.
    SeniorManagerSheetReview:
      type: object
      required: [sheet, progress, transactions]
      properties:
        # Owner decision (2026-11-20): the per-sheet read's sheet summary requires the whole-sheet
        # `stageApprovedTotals` aggregate. `SeniorSheetSummary` is deliberately left without the
        # property: the senior queue list rows reuse that shared schema and must not pay a
        # per-sheet aggregate computation for a list page, so the requiredness lives on the
        # per-sheet read only. Aggregate disclosure widens no transaction, evidence, or
        # individual-decision visibility.
        sheet:
          allOf:
            - $ref: '#/components/schemas/SeniorSheetSummary'
            - type: object
              required: [stageApprovedTotals]
              properties:
                stageApprovedTotals: { $ref: '#/components/schemas/StageApprovedTotals' }
        progress: { $ref: '#/components/schemas/SeniorSheetProgress' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/SeniorTransactionSummary' }
    # Feature 007 (UX-007-07): one row of the additive `GET /queues/senior/sheets` list. Reuses
    # SeniorSheetSummary so a list row and the per-sheet read cannot disagree, and adds the two
    # members only a list row carries.
    SeniorSheetQueueItem:
      allOf:
        - $ref: '#/components/schemas/SeniorSheetSummary'
        - type: object
          required: [progress, latestActivityAt]
          properties:
            progress: { $ref: '#/components/schemas/SeniorSheetProgress' }
            latestActivityAt:
              type: string
              format: date-time
              nullable: true
              description: >
                The newest authoritative timestamp the acting senior manager may read for this
                sheet: its created/first-submitted/completed instants and the transaction or
                decision instants of this manager's scoped projection. `null` only when the
                backend holds none of those; it is never fabricated from client input.
    Revision:
      type: object
      required: [id, number, expenseDate, amount, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        expenseDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string, nullable: true }
        costCenter: { $ref: '#/components/schemas/EntitySnapshot' }
        expenseType: { $ref: '#/components/schemas/EntitySnapshot' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        active: { type: boolean }
    EntitySnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, nullable: true }
        name: { type: string }
    DecisionWrite:
      type: object
      required: [decision, expectedVersion]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT, RETURN] }
        explanation: { type: string, nullable: true }
        expectedVersion: { type: integer, minimum: 0 }
    Decision:
      type: object
      required: [id, stage, decision, actor, decidedAt]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, enum: [COST_CENTER, SENIOR, FINANCE] }
        decision: { type: string, enum: [APPROVE, REJECT, RETURN] }
        explanation: { type: string, nullable: true }
        actor: { $ref: '#/components/schemas/ActorSnapshot' }
        decidedAt: { type: string, format: date-time }
    DecisionResult:
      type: object
      required: [decision, transaction]
      properties:
        decision: { $ref: '#/components/schemas/Decision' }
        transaction: { $ref: '#/components/schemas/TransactionDetail' }
        accountMutation: { $ref: '#/components/schemas/AccountMutationResult' }
    ActorSnapshot:
      type: object
      required: [userId, displayName, role]
      properties:
        userId: { type: string }
        displayName: { type: string }
        role: { type: string }
    Evidence:
      type: object
      required: [id, transactionId, revisionId, name, mediaType, sizeBytes, active, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        name: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        active: { type: boolean }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        deactivatedAt: { type: string, format: date-time, nullable: true }
        # Why the evidence was deactivated, when it was.
        #
        # Declared by T339 rather than removed from the response. `EvidenceController` emitted it and
        # this schema did not describe it, so a reader could tell the two removal paths apart on one
        # endpoint and not the other — and it is not cosmetic. FR-058 requires submitted evidence to be
        # "marked inactive rather than physically removed", and the reason is the only observable of
        # *which* path ran: the row is deactivated either way, and `GET /evidence/{id}/content` answers
        # 403 once inactive. `EvidenceLifecycleControllerTest::
        # testTheRecordedReasonShowsWhichRemovalActuallyHappened` is the pin that says so.
        deactivationReason: { type: string, nullable: true }
    EvidenceLink:
      type: object
      required: [id, evidenceId, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        url: { type: string, nullable: true, description: Returned only at creation }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, eventType, actor, occurredAt]
      properties:
        id: { type: string, format: uuid }
        # FR-051 plus **FR-085**. `SUPERSEDED_ATTEMPT` is a real member of this vocabulary, not an
        # `after` payload: it is the record of a decision that was refused because the transaction had
        # already moved on. It is deliberately **neither an approval nor a rejection** -- recording it
        # as either would falsify the decision history -- and it is deliberately not omitted either,
        # because a discarded attempt is indistinguishable from a request that never happened and would
        # leave a reviewer who acted with no trace.
        eventType:
          type: string
          enum:
            - SHEET_SUBMITTED
            - TRANSACTION_ROUTED
            - DECISION_APPROVED
            - DECISION_REJECTED
            - TRANSACTION_RETURNED
            - CORRECTION_SUBMITTED
            - REVISION_CREATED
            - TRANSACTION_CHANGED
            - EVIDENCE_ADDED
            - EVIDENCE_DEACTIVATED
            - SETTLEMENT_RECORDED
            - SUPERSEDED_ATTEMPT
        stage: { type: string, nullable: true }
        decision: { type: string, nullable: true }
        explanation: { type: string, nullable: true }
        actor: { $ref: '#/components/schemas/ActorSnapshot' }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }
        # FR-085: on `SUPERSEDED_ATTEMPT`, `before` carries the decision already in force and `after`
        # carries the decision the caller attempted, so one read reconstructs the race without needing
        # a second query.
        occurredAt: { type: string, format: date-time }
    # FR-064/FR-065/FR-068: the accepted filter vocabulary, as a **closed** set.
    #
    # `additionalProperties: false` is the load-bearing line, and it is the whole of T374. This object
    # used to be `type: object` with `additionalProperties: true` and no enumeration, so a client
    # generated from this document could send any key at all -- while the server refuses an unrecognised
    # filter with a `422` rather than ignoring it. The generated client and the server therefore disagreed
    # about what a legal request was, and the `422` that disagreement produces was nowhere declared here,
    # so a client had no documented way to learn which filters exist or that unknown ones are refused
    # rather than dropped.
    #
    # Declaring the closure here also means the 15 names are stated once. `ReportFilterFactory::ACCEPTED_FILTERS`
    # is the server's copy and this is the contract's; a filter added to one and not the other is drift in
    # whichever direction is worse -- a client that can send what the server refuses, or a filter the
    # contract never mentioned.
    #
    # Ignoring an unknown filter is what makes closure necessary rather than pedantic: silently discarding
    # it returns the *unfiltered* answer, and the caller cannot tell that apart from a filter that matched
    # everything. A refusal the caller can see is the only way the two are distinguishable.
    ReportFilters:
      type: object
      additionalProperties: false
      description: >-
        FR-064/FR-065 report filters in the server's vocabulary. The set is **closed**: an unrecognised
        key is refused with `422` naming it and the accepted list, never ignored, because ignoring it
        returns the unfiltered report and the caller cannot tell the difference. Both endpoints read the
        same object -- `GET /reports` as a JSON-encoded query parameter, `POST /exports` as a JSON body
        member -- so the vocabulary is one set, not one per transport.
      properties:
        # --- Date and period ---
        # Typed `string` rather than `format: date-time` on purpose: the server hands the value to
        # `new DateTimeImmutable()`, which also accepts a bare `YYYY-MM-DD`, and declaring the narrower
        # format would be a stricter promise than the implementation keeps. T373 sends the bare date form
        # and it is accepted.
        from:
          type: string
          description: >-
            Inclusive lower bound, ISO-8601. A date or a date-time; anything `DateTimeImmutable` parses is
            accepted. Mutually exclusive with `period`.
        to:
          type: string
          description: Inclusive upper bound, ISO-8601. Mutually exclusive with `period`.
        period:
          type: string
          enum: [month, quarter, year]
          description: >-
            A predefined Jalali period in progress, resolved at query time in the requesting user's own time
            zone (their account setting, else the instance default). Each names the period **in progress at
            request time**, first day through last inclusive: `month`/`quarter`/`year` are Jalali (Solar
            Hijri), a year spans Farvardin to Esfand, and a quarter begins at Farvardin. A previous or
            trailing period is requested with `from`/`to` instead.
            Mutually exclusive with `from`/`to` within one request: supplying both is refused with `422`
            naming the conflict and stating which to remove. Neither is honoured while the other is
            discarded, and they are never intersected. FR-068 was amended on 2026-09-30 to state that
            `period` is a member in its own right rather than a parameterisation of `from`/`to`; before
            that this document's own closed-vocabulary rule forbade a filter FR-068 required.
        # --- Facet lists ---
        # Every facet below is a **list on the wire**, because the server refuses a non-array for each of
        # them. A single-select control sends a one-element list, not a bare string; a bare string is a 422
        # on a filter the user filled in correctly.
        statuses:
          type: array
          items: { type: string }
          description: Sheet/transaction workflow statuses. A list even for one value.
        stages:
          type: array
          items: { type: string }
          description: Workflow stages.
        currencyCodes:
          type: array
          items: { type: string }
          description: ISO currency codes.
        eventTypes:
          type: array
          items: { type: string }
          description: Configuration/audit event types.
        actorUids:
          type: array
          items: { type: string }
          description: Nextcloud user ids of actors.
        # --- Two id spaces per facet, unioned ---
        # `costCenterIds`/`expenseTypeIds` name **public UUIDs**; `costCenterDbIds`/`expenseTypeDbIds` name
        # internal integer join keys. Both spellings name members of one facet, so a request naming both
        # means the **union** of the two sets -- not a precedence rule, which would silently discard
        # whichever the caller happened to spell differently. The UUID forms are the ones a client should
        # send; the integer forms exist so a server-side caller need not resolve a public id first.
        costCenterIds:
          type: array
          items: { type: string, format: uuid }
          description: Cost centres by **public UUID**.
        costCenterDbIds:
          type: array
          items: { type: integer }
          description: >-
            Cost centres by internal database id. An internal join key, unioned with `costCenterIds` rather
            than preferred over it.
        expenseTypeIds:
          type: array
          items: { type: string, format: uuid }
          description: Expense types by **public UUID**.
        expenseTypeDbIds:
          type: array
          items: { type: integer }
          description: Expense types by internal database id, unioned with `expenseTypeIds`.
        # --- Scalars ---
        createdBy:
          type: string
          description: Nextcloud user id of the creator.
        amountMinMinor:
          type: integer
          description: >-
            Inclusive lower amount bound in the **minor units of the row's own currency**. A whole number,
            not a major-unit decimal: there is no fiscal or display rounding on this path, so a bound that
            silently multiplied or divided by 1000 would be a wrong financial answer rather than a wrong
            display.
        amountMaxMinor:
          type: integer
          description: Inclusive upper amount bound, in minor units. See `amountMinMinor`.
    ReportPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            columns: { type: array, items: { type: string } }
            rows: { type: array, items: { type: object, additionalProperties: true } }
            # FR-068: when the request resolved a predefined `period`, this carries `period`,
            # `resolvedFrom`, `resolvedTo` and `resolvedTimeZone`. Absent otherwise, rather than present
            # and null -- a key describing a request the response did not use is a claim about the request
            # rather than about the answer.
            summary: { type: object, additionalProperties: true }
    ExportResult:
      type: object
      required: [artifactName, mediaType, format, byteSize, rowCount, data]
      properties:
        artifactName: { type: string, description: Transient name; the artifact is removed once streamed }
        mediaType:
          type: string
          description: The artifact's own media type, not the envelope's
          enum: [text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/pdf, application/zip]
        format: { type: string, enum: [csv, xlsx, pdf, zip] }
        byteSize: { type: integer }
        rowCount: { type: integer }
        # FR-068. Present only when the request resolved a predefined `period`. Both the range and the zone
        # are stated so two users in different zones can tell a different period from a different
        # timezone -- which is where an export's numbers actually get reconciled against each other.
        period: { type: string, enum: [month, quarter, year] }
        resolvedFrom: { type: string, format: date, description: First day of the resolved period, inclusive }
        resolvedTo: { type: string, format: date, description: Last day of the resolved period, inclusive }
        resolvedTimeZone:
          type: string
          description: The zone the period was resolved in, not an offset
        data: { type: string, format: byte, description: base64-encoded artifact bytes }
        artifactRemoved: { type: boolean, description: True once the transient artifact has been deleted }
    ExportRequest:
      type: object
      required: [resource, fileFormat]
      properties:
        resource:
          type: string
          enum: [sheet, sheets, transactions, report, audit, evidence, senior-queue]
          description: >
            `senior-queue` is the additive Feature 007 Senior-scoped export (T028): XLSX only, rows
            resolved in `ids` order and scope-validated against the caller's active SENIOR_MANAGER
            assignments before generation; existing owner-scoped resources are unchanged.
        # Named `fileFormat`, not `format`. Nextcloud's OCS layer reserves the request
        # parameter `format` for choosing the response envelope: `Request::getFormat()`
        # (lib/private/AppFramework/Http/Request.php:903) reads `getParam('format')` *before*
        # the `Accept` header, and `OCSMiddleware` falls back to `xml` whenever the value is not
        # a registered responder. A request carrying a field literally called `format`
        # therefore always answers XML and no `Accept` header can override it, which would make
        # every conforming request to this endpoint return the wrong envelope.
        fileFormat:
          type: string
          enum: [csv, xlsx, pdf, zip]
        ids:
          type: array
          items: { type: string, format: uuid }
        reportType:
          type: string
          nullable: true
        filters:
          # T374: the vocabulary is declared once, in `ReportFilters`, and referenced here. This used to
          # be an open `type: object` with `additionalProperties: true` that declared only `period` -- so a
          # client generated from this document could send a filter the server refuses with a `422` the
          # document never described. One referenced schema also means the export and report endpoints
          # cannot drift into declaring different vocabularies.
          $ref: '#/components/schemas/ReportFilters'
