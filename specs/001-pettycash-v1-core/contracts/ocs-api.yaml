openapi: 3.0.3
info:
  title: PettyCash V1 OCS API
  version: 1.0.0-draft
  description: |
    Versioned JSON contract for the PettyCash Nextcloud application. The deployed base path is
    /ocs/v2.php/apps/pettycash/api/v1. JSON responses use the standard OCS envelope; schemas below
    describe the value carried in ocs.data unless an operation streams a file.
servers:
  - url: /ocs/v2.php/apps/pettycash/api/v1
security:
  - nextcloudSession: []
tags:
  - name: Session
  - name: Configuration
  - name: Accounts
  - name: Sheets
  - name: Transactions
  - name: Workflow
  - name: Evidence
  - name: Audit
  - name: Reports
  - name: Exports
  - name: Finance

paths:
  /me:
    get:
      tags: [Session]
      summary: Return the current user and effective capabilities
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard:
    get:
      tags: [Session]
      summary: Return role-scoped dashboard cards and work summaries
      responses:
        '200':
          description: Dashboard projection for all active roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'

  /configuration/currencies:
    get:
      tags: [Configuration]
      summary: List currencies visible to the current administrative context
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/CurrencyPage'
    post:
      tags: [Configuration]
      summary: Create a currency
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyWrite'
      responses:
        '201':
          description: Currency created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /configuration/currencies/{currencyId}:
    patch:
      tags: [Configuration]
      summary: Update or activate/deactivate a currency
      parameters:
        - $ref: '#/components/parameters/CurrencyId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CurrencyWrite'
                - $ref: '#/components/schemas/ExpectedVersion'
      responses:
        '200':
          description: Updated currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
        '409':
          $ref: '#/components/responses/Conflict'

  /configuration/cost-centers:
    get:
      tags: [Configuration]
      summary: List cost centers within the caller's view scope
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/CostCenterPage'
    post:
      tags: [Configuration]
      summary: Create a cost center and current manager assignments
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostCenterWrite'
      responses:
        '201':
          description: Cost center created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostCenter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /configuration/cost-centers/{costCenterId}:
    patch:
      tags: [Configuration]
      summary: Update a cost center or its current assignments
      parameters:
        - $ref: '#/components/parameters/CostCenterId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CostCenterWrite'
                - $ref: '#/components/schemas/ExpectedVersion'
      responses:
        '200':
          description: Updated cost center
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostCenter'
        '409':
          $ref: '#/components/responses/Conflict'

  /configuration/expense-types:
    get:
      tags: [Configuration]
      summary: List expense types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ExpenseTypePage'
    post:
      tags: [Configuration]
      summary: Create an expense type
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseTypeWrite'
      responses:
        '201':
          description: Expense type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseType'

  /configuration/expense-types/{expenseTypeId}:
    patch:
      tags: [Configuration]
      summary: Update or activate/deactivate an expense type
      parameters:
        - $ref: '#/components/parameters/ExpenseTypeId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExpenseTypeWrite'
                - $ref: '#/components/schemas/ExpectedVersion'
      responses:
        '200':
          description: Updated expense type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseType'

  /configuration/finance-assignments:
    get:
      tags: [Configuration]
      summary: List shared-queue finance officers
      responses:
        '200':
          description: Active and historical finance assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
    post:
      tags: [Configuration]
      summary: Add or update a shared-queue finance assignment
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAssignmentWrite'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'

  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts permitted for the caller
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/AccountPage'
    post:
      tags: [Accounts]
      summary: Create a user account for a supported currency
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '200':
          description: Retired pair re-opened by an administrator (same Account shape, nothing created)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }

  /accounts/{accountId}:
    # T409 / FR-013. Administrator deactivation and reactivation of an account. This operation did not
    # exist — the complete account surface was index/create/charge/movements — so no artifact could
    # deactivate an account except through owner deletion, and FR-020's inactive-account refusal had no
    # reachable trigger.
    patch:
      tags: [Accounts]
      summary: Deactivate or reactivate a petty-cash account
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AccountActiveUpdate'
                - $ref: '#/components/schemas/ExpectedVersion'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /accounts/{accountId}/charges:
    post:
      tags: [Accounts]
      summary: Charge a petty-cash account
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCharge'
      responses:
        '201':
          description: Charge movement and updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMutationResult'
        '409':
          $ref: '#/components/responses/Conflict'

  /accounts/{accountId}/movements:
    get:
      tags: [Accounts]
      summary: List permitted account movements
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/MovementPage'

  /sheets:
    get:
      tags: [Sheets]
      summary: List role-scoped sheets
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SheetStatus' }
        - name: ownerId
          in: query
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/SheetPage'
    post:
      tags: [Sheets]
      summary: Create an open sheet
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SheetCreate'
      responses:
        '201':
          description: Sheet created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetDetail' }

  /sheets/{sheetId}:
    get:
      tags: [Sheets]
      summary: Return a role-scoped sheet detail projection
      parameters:
        - $ref: '#/components/parameters/SheetId'
      responses:
        '200':
          description: Sheet detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetDetail' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sheets]
      summary: Update an open sheet
      description: >
        Title-only update of an existing open sheet. The request body is `SheetUpdate`, so it carries
        only `title` and `expectedVersion`; `SheetCreate`'s account-selection/provisioning semantics
        do not apply. Any supplied `accountId` is refused with `422 VALIDATION_FAILED` and
        `fieldErrors.accountId` before persistence — a supplied value does not authorize account
        replacement.
      parameters:
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SheetUpdate'
      responses:
        '200':
          description: Updated sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetDetail' }
        # T416. This operation already required `ExpectedVersion` and already refused a stale one --
        # it answered `422`, because the guard raised `InvalidArgumentException`, which is what
        # `OcsErrorMapper` maps that class to. The request is well formed; the caller's view is out of
        # date. FR-025 requires a `409` on a sheet's own pre-submission fields, matching the `409`
        # `PATCH /transactions/{id}` already declared. The declaration was missing, not the behaviour.
        '409':
          $ref: '#/components/responses/Conflict'
    # T417 / FR-086. Owner deletion of a sheet that has **never been submitted**, with its draft
    # transactions, their revisions, and their stored evidence files, removed atomically.
    #
    # `X-PettyCash-Command-ID` is **required**, exactly as it is on `DELETE /transactions/{id}`.
    # Without a gate a sheet delete would answer "not found" on the retry, so a client that lost the
    # first response could not tell its own success from a failure. FR-086 makes FR-084 apply here
    # for that reason; the transaction delete carries the same gate under FR-025.
    delete:
      tags: [Sheets]
      summary: Delete an own sheet that has never been submitted
      parameters:
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '204': { description: Sheet and its draft subtree removed }
        '409':
          $ref: '#/components/responses/Conflict'

  /sheets/{sheetId}/submit:
    post:
      tags: [Workflow]
      summary: Validate and submit an open sheet
      parameters:
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '200':
          description: Submitted sheet and routed transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetDetail' }
        '422':
          # FR-091: when a receipt-required transaction has no active receipt, `fieldErrors` carries
          # one entry per offending transaction keyed `transactions.<transactionId>.evidence`. The
          # response names every offending transaction, not only the first.
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /sheets/{sheetId}/transactions:
    post:
      tags: [Transactions]
      summary: Add a draft transaction to an open sheet
      parameters:
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionDraftWrite' }
      responses:
        '201':
          description: Draft transaction created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }

  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Return transaction detail and allowed actions
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
    patch:
      tags: [Transactions]
      summary: Update a draft transaction or correction draft
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransactionDraftWrite'
                - $ref: '#/components/schemas/ExpectedVersion'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Transactions]
      summary: Delete a draft transaction from an open sheet
      # T436 / FR-025. Draft deletion is a replay-gated command: the client keeps one
      # `X-PettyCash-Command-ID` across retries so a lost 204 is distinguishable from a
      # failure. A successful delete has no body (204); the same command id and payload
      # returns that same 204 even though the row is gone. A different command id after
      # the row is gone is `404`, never a second success. `expectedVersion` remains a
      # concurrency guard, not a replay guard.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '204': { description: Draft transaction deleted; bodyless success }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /transactions/{transactionId}/decisions:
    post:
      tags: [Workflow]
      summary: Record the actor's permitted decision for the current stage
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionWrite' }
      responses:
        '201':
          description: Decision, updated transaction, and any account effect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResult' }
        # T427. Two `400` reasons share this declaration. T426's bulk refusal answers `badRequest` when the
        # body carries `transactionIds`, `transactions`, `ids`, or a `transactionId` that disagrees with the
        # path — a request V1 cannot satisfy under FR-033's single-transaction rule, so the refusal names the
        # field rather than narrowing the decision to the path's transaction. The missing-commandId refusal
        # answers `400` for the same reason and was likewise undeclared; one declaration covers both, since
        # both are the same class of fault (a request the caller must change, not a field value that failed
        # validation — hence `400` rather than the `422` below).
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /transactions/{transactionId}/correction:
    post:
      tags: [Transactions]
      summary: Create a correction draft from the active returned revision
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '201':
          description: Correction draft revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
        # T416. The `409` was already reachable here and already answered as one: the
        # `NotAwaitingCorrection` refusal on this operation is a `Conflict`, so the operation
        # declared a `409` by behaviour and by the very next refusal a caller can hit. The stale
        # `expectedVersion` refusal is the same answer for the same reason, so it is stated rather
        # than left to be inferred from the exception type.
        '409':
          $ref: '#/components/responses/Conflict'

  /transactions/{transactionId}/resubmit:
    post:
      tags: [Workflow]
      summary: Validate and activate a correction revision
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '200':
          description: New active revision routed to cost-center review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        # FR-091: the correction resubmission applies the same conditional receipt rule as sheet
        # submission. A receipt-required transaction with no active receipt answers 422 with a
        # `transactions.<transactionId>.evidence` field error; a receipt-exempt transaction is not
        # refused for that reason.
        '422':
          $ref: '#/components/responses/ValidationError'
        # T416. This operation declares a **required** `ExpectedVersion` body, so a stale version is
        # reachable by construction and the contract had no stated answer for it. FR-025: a stale
        # pre-submission edit is a `409` whose recovery is "reload", not a `422` telling the caller to
        # fix a request that was already correct.
        '409':
          $ref: '#/components/responses/Conflict'

  /transactions/{transactionId}/revisions:
    get:
      tags: [Audit]
      summary: List authorized immutable revisions
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Revision history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Revision' }

  /transactions/{transactionId}/audit:
    get:
      tags: [Audit]
      summary: List authorized business history
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/AuditPage'

  /queues/{stage}:
    get:
      tags: [Workflow]
      summary: Return the caller's cost-center, senior, or shared finance queue
      description: >
        Paged transaction summaries for the caller's stage queue. For `stage=finance` only, each
        item additionally carries `stageApprovedTotals` (owner decision, 2026-11-20): the owning
        Cost Sheet's whole-sheet approved totals per workflow stage, computed by the server from
        the complete sheet transaction set, identical for every item of the same Sheet. Aggregate
        disclosure only — no transaction, evidence, actor, comment, or individual-decision
        visibility is widened, and the finance queue's eligibility and authorization are unchanged.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
            enum: [cost-center, senior, finance]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/TransactionPage'

  /queues/cost-center/sheets/{sheetId}:
    get:
      tags: [Workflow]
      summary: Return one sheet as the acting cost-centre manager may see it
      description: >
        Additive manager-scoped read introduced for Feature 006 Batch 1 (B001–B004). Authorization
        is the acting user's active `COST_CENTER_MANAGER` assignments; an unknown sheet and a sheet
        outside those cost centres both answer `404`, so the endpoint cannot confirm a sheet exists
        outside the caller's scope. The transaction list contains only current-revision transactions
        that await this manager, were decided by this manager, or were returned by this manager.
        Transactions decided by another manager are never included. `progress.managerComplete` means only that no
        transaction in this manager's scope still awaits their decision; it is not whole-sheet
        cost-centre completion and says nothing about Senior eligibility (FR-006-047/048). The
        response also carries `sheet.stageApprovedTotals` (owner decision, 2026-11-20): the
        sheet's whole-Cost-Sheet approved totals per workflow stage, computed from the complete
        sheet transaction set — aggregate monetary disclosure only, widening no transaction,
        evidence, or individual-decision visibility.
      parameters:
        - $ref: '#/components/parameters/SheetId'
      responses:
        '200':
          description: Manager-scoped sheet review projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerSheetReview' }
        '404':
          $ref: '#/components/responses/NotFound'

  /queues/senior/sheets:
    get:
      tags: [Workflow]
      summary: List Cost Sheets the acting senior manager may read, including completed ones
      description: >
        Additive senior-scoped list introduced to retain completed Cost Sheets in the Senior
        Manager review surface (Feature 007, UX-007-07). Authorization is the acting user's active
        `SENIOR_MANAGER` assignments, identical to the per-sheet read below: a sheet is listed
        when at least one current-revision transaction is in a managed cost centre and is either
        awaiting any senior of that cost centre or carries a current-revision decision by this
        senior. A transaction another senior decided is never disclosed and a sheet whose only
        scoped transactions carry such a decision is not listed (FR-007-056). The list is
        transaction-derived but never reconstructed from the currently-pending Senior set alone: a
        sheet whose final decision already advanced its transactions to Finance stays listed.
        Each row reuses `SeniorSheetSummary` (identity, title, owner, currency-safe submission
        money, the backend-computed sheet-wide `allTransactionsCostCenterDecided` gate, and the
        presentation `reviewStatus`) plus the senior-scoped `progress` counts and `latestActivityAt`
        where authoritative data exists. `reviewStatus` is `REVIEW_COMPLETED` only when nothing
        awaits this senior's decision and no scoped transaction carries an unresolved `Return` by
        this senior; a Return sends the sheet back to correction instead of completing the review
        (FR-007-017). The list is read-only and never exposes a decision capability or an
        unrestricted historical read. `total` counts the sheets in scope, not the page, and no
        completed sheet is silently truncated by pagination.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/SeniorSheetQueue'
        '404':
          $ref: '#/components/responses/NotFound'

  /queues/senior/sheets/{sheetId}:
    get:
      tags: [Workflow]
      summary: Return one sheet as the acting senior manager may see it
      description: >
        Additive senior-scoped read introduced for Feature 007 backend batch (T024/T025). Authorization
        is the acting user's active `SENIOR_MANAGER` assignments; an unknown sheet and a sheet outside
        those cost centres both answer `404`, so the endpoint cannot confirm a sheet exists outside
        the caller's scope (FR-007-056). The transaction list contains only current-revision
        transactions awaiting any senior of the assigned cost centre or decided by this senior;
        another senior's decision is never disclosed. `sheet.allTransactionsCostCenterDecided` is the
        backend-computed, sheet-wide Cost Center completion gate (owner D1, FR-007-013, 001 FR-037):
        true only when every transaction on the sheet has a final Cost Center decision (Approve,
        Reject, or a Return corrected and then re-decided); a pending Return does not satisfy it.
        `sheet.reviewStatus` is a presentation-only `PENDING_REVIEW`/`REVIEW_COMPLETED` value (owner
        D5, FR-007-017) — never the domain `SheetStatus` and never derived client-side. The response
        also carries `sheet.stageApprovedTotals` (owner decision, 2026-11-20): the sheet's
        whole-Cost-Sheet approved totals per workflow stage, computed from the complete sheet
        transaction set — aggregate monetary disclosure only, widening no transaction, evidence, or
        individual-decision visibility.
      parameters:
        - $ref: '#/components/parameters/SheetId'
      responses:
        '200':
          description: Senior-scoped sheet review projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeniorManagerSheetReview' }
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Feature 008 — Finance Manager Account Management (additive read surface).
  # Five read-only operations gated by an effective FINANCE role assignment
  # (FR-008-005); the actor uid always comes from the authenticated session,
  # never from a request parameter. The recharge write is NOT redefined here:
  # POST /accounts/{accountId}/charges remains the single financial write this
  # module uses, unchanged. No operation below mutates anything, and none
  # widens the purchaser-owned reads.
  # -------------------------------------------------------------------------
  /finance/holders:
    get:
      tags: [Finance]
      summary: List petty-cash holders (users owning at least one account)
      description: >
        Feature 008 additive read (FR-008-008/009). Authorization is an effective
        FINANCE role assignment; a caller without it receives 403 and no holder
        data (FR-008-005). The candidate population is exactly the distinct
        petty-cash account owners — never the unrestricted Nextcloud user
        directory (FR-008-006). `search` is trimmed, bounded to 64 characters,
        and matched case-insensitively as a substring against the holder's
        `userId` or `displayName`, server-side over the complete holder
        population before pagination — never a page-local filter and never a
        Nextcloud directory search or enumeration. Display names are resolved
        server-side only for account-owning uids. `total` counts all matching
        holders, not the page length; an empty result is 200 with `items: []`
        and `total: 0`, never 404.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: >-
            Case-insensitive substring matched against the holder `userId` or
            `displayName` within the account-owning holder population only;
            trimmed, at most 64 characters; empty means no filter.
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          $ref: '#/components/responses/FinanceHolderPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /finance/holders/{holderUid}/accounts:
    get:
      tags: [Finance]
      summary: List one holder's petty-cash accounts, active and inactive
      description: >
        Feature 008 additive read (FR-008-010/011). Authorization is an
        effective FINANCE role assignment. Every account of the holder is
        listed, including inactive ones; the payload is read-only and carries
        no mutation capability. `version` is the optimistic-lock value the
        existing recharge write must send; `movementCount`/`lastMovementAt`
        are presentation facts batched from the movement table. A uid owning
        no account and an unknown uid both answer 404, so the endpoint is not
        an account-ownership oracle. The purchaser-owned reads
        (GET /accounts, GET /accounts/{accountId}/movements) are unchanged.
      parameters:
        - $ref: '#/components/parameters/HolderUid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/FinanceHolderAccountPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /finance/accounts/{accountId}/ledger:
    get:
      tags: [Finance]
      summary: Return the unified six-column ledger projection for one account
      description: >
        Feature 008 additive read (FR-008-012..025). Authorization is an
        effective FINANCE role assignment. The row order is
        `occurredAt DESC, id DESC` and `total` is a count of all movements for
        the account, not the page length. Invariants carried by
        `FinanceLedgerRow`: `occurredAt` is the authoritative persisted
        movement posting timestamp — never the Cost Sheet creation date or the
        transaction expense date (FR-008-014); `balanceAfter` is the
        authoritative persisted resulting balance and the client never derives
        a balance by summing the page (FR-008-019/023/024); exactly one of
        `recharge`/`expense` is non-null per row (FR-008-018); `approved` is
        the Cost Sheet's approved/total transaction count pair for a
        consumption and null — rendered as not applicable — for a recharge
        (FR-008-016/017); the schema has no rejected-count field (FR-008-020)
        and no mutation capability (FR-008-025). Every authoritative movement
        stays individually represented — no consolidated Cost Sheet financial
        row exists in this projection (FR-008-021). A consumption whose
        revision→transaction→sheet chain cannot be resolved is a data fault
        (`DATA_FAULT`), not an `approved: null` row.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/FinanceLedgerPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /finance/completed-sheets:
    get:
      tags: [Finance]
      summary: List completed Cost Sheets with terminal Finance outcomes
      description: >
        Feature 008 additive read (FR-008-032/033/035). Authorization is an
        effective FINANCE role assignment. Only sheets whose status is
        COMPLETED or COMPLETED_WITH_REJECTIONS are listed — a sheet with any
        transaction still awaiting a Finance decision is absent, and a
        completion with rejections is included with its honest zero or partial
        counts and posted amount (FR-008-036). `postedAmount` is the sum of
        the consumption movements actually linked to the sheet and
        `postingCount` their count — never a projection assuming every
        approved transaction posted (FR-008-035); `approved + rejected =
        total` for every listed sheet. `reference` is the authoritative public
        sheet UUID; no other reference format exists. The list is strictly
        read-only (FR-008-038), ordered `completedAt DESC, id DESC`, and
        paginated with `total` counting all matching sheets.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/CompletedSheetPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /finance/completed-sheets/{sheetId}:
    get:
      tags: [Finance]
      summary: Return one completed Cost Sheet as read-only history
      description: >
        Feature 008 additive read (FR-008-034/036/038). Authorization is an
        effective FINANCE role assignment. The detail is returned only when
        the sheet is terminal and every transaction is COMPLETED_APPROVED or
        COMPLETED_REJECTED — otherwise 404, so a pending Finance-review state
        can never appear as history (FR-008-036). `expenseDate` is the
        transaction's business expense date and `posting.occurredAt` the
        accounting posting timestamp; they may differ and are never conflated.
        `posting` is null for a rejected transaction; `postedAmount` sums the
        actual postings across the response, with `postingCount` matching the
        non-null postings. Evidence is metadata only — content is read through
        GET /evidence/{evidenceId}/content under the read-only
        completed-history authorization documented on that operation
        (FR-008-037); this response embeds no content, URL, or token. The
        response contains no decision, mutation, or capability field
        (FR-008-038).
      parameters:
        - $ref: '#/components/parameters/SheetId'
      responses:
        '200':
          description: Read-only completed Cost Sheet detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletedSheetDetail' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /returns:
    get:
      tags: [Workflow]
      summary: Return the current purchaser's correction queue
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/TransactionPage'

  /transactions/{transactionId}/evidence:
    post:
      tags: [Evidence]
      summary: Upload evidence for a draft or permitted transaction state
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Evidence metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }

  /evidence/{evidenceId}:
    delete:
      tags: [Evidence]
      summary: Delete draft evidence or deactivate submitted evidence
      # Effect-idempotent command: no `X-PettyCash-Command-ID`. A draft deletion removes the row;
      # a submitted deletion leaves the row deactivated, so a repeat returns the same `200` and the
      # same metadata, including the `deactivatedAt` recorded by the *first* call. This is the
      # deliberate exception to the replay-gated delete rule, not the transaction/sheet pattern.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Deactivated evidence metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '204': { description: Draft evidence deleted }

  /evidence/{evidenceId}/content:
    get:
      tags: [Evidence]
      summary: Stream authorized evidence content or preview
      description: >
        Feature 008 authorization extension (FR-008-037), documentation only — the
        request and response shapes of this operation are unchanged. Beyond the
        existing authorization rule, an actor with an effective FINANCE role
        assignment is admitted read-only when the evidence belongs to a transaction
        that is terminal (COMPLETED_APPROVED or COMPLETED_REJECTED at the Final
        stage) in a sheet whose status is COMPLETED or COMPLETED_WITH_REJECTIONS
        and whose every transaction is terminal — the same completed-history scope
        that gates GET /finance/completed-sheets/{sheetId}. The extension is
        content-only: it grants no upload, replacement, deletion, deactivation,
        link creation, or any other evidence mutation, and it does not widen
        audit or revision visibility or any existing purchaser, Cost Center
        Manager, or Senior Manager evidence result. Out-of-scope callers keep the
        existing non-disclosure answers; deactivated evidence keeps its 403.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - name: disposition
          in: query
          description: >-
            Preview or download. Honoured for a media type that is safe to render in the
            Nextcloud origin (images, PDF, plain text). A media type outside that set is
            always served as `application/octet-stream` with an `attachment` disposition
            regardless of this parameter, because an attacker-supplied type served inline
            would execute as script in the viewer's session. FR-060.
          schema:
            type: string
            enum: [inline, attachment]
            default: inline
      responses:
        '200':
          # FR-060 (T275). This used to declare exactly one success content type,
          # `application/octet-stream`, which made the requirement's preview journey
          # unimplementable while the same block declared a `disposition` parameter
          # defaulting to `inline` -- a value that cannot render an octet-stream body. The
          # 2026-09-30 clarification settled that the contract was the artifact at fault.
          #
          # The declared set is now the closed set the endpoint can actually return: the
          # inline-safe types are served with their own media type so they render, and
          # everything else is served as `application/octet-stream`. Listing them explicitly
          # rather than writing "the stored media type" keeps the response checkable -- a new
          # type cannot be served without either appearing here or being coerced to the
          # fallback.
          #
          # `image/svg+xml` is deliberately absent from the inline-safe set. SVG is an image
          # and it can carry `<script>`; serving it inline would execute script in the
          # viewer's session, which is the harm FR-060 names. It is served as
          # `application/octet-stream` with an `attachment` disposition like any other
          # unlisted type.
          description: Evidence byte stream
          content:
            'application/octet-stream':
              schema: { type: string, format: binary }
            'application/pdf':
              schema: { type: string, format: binary }
            'image/png':
              schema: { type: string, format: binary }
            'image/jpeg':
              schema: { type: string, format: binary }
            'image/gif':
              schema: { type: string, format: binary }
            'image/webp':
              schema: { type: string, format: binary }
            'image/bmp':
              schema: { type: string, format: binary }
            'text/plain':
              schema: { type: string, format: binary }

  /evidence/{evidenceId}/links:
    post:
      tags: [Evidence]
      summary: Create an administrator-controlled public link
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Public link; raw token is returned only at creation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceLink' }

  /evidence-links/{linkId}/deactivate:
    post:
      tags: [Evidence]
      summary: Deactivate a public evidence link
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: Deactivated link metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceLink' }

  # FR-031 (**clarified 2026-10-07**). This is the **only route in V1 reachable without
  # authentication**, and it exists because the token *is* the authority: anyone holding the unguessable
  # token may open the evidence, without a session and without any role or responsibility scope.
  #
  # Three properties are load-bearing and each is a defect if violated:
  #
  # 1. **No `CommandId` parameter and no `security` requirement.** Consumption is idempotent by the
  #    token itself and mutates nothing business-side; requiring a command identifier would be
  #    incoherent, and declaring an authenticated security scheme would contradict the decision.
  # 2. **`404` for unknown, deactivated, and expired alike.** A response that distinguishes "you had a
  #    link, it lapsed" from "no such link" turns the error itself into a confirmation that evidence
  #    exists, so all three MUST produce one identical response.
  # 3. **FR-060's media-type policy applies here too.** Content is inline only for the inline-safe
  #    stored media types and `application/octet-stream` + `attachment` otherwise. This is the one place
  #    where an attacker-supplied stored type would be rendered against a viewer who never authenticated,
  #    so the same policy cannot be relaxed for public links.
  #
  # Abuse control is delegated to Nextcloud's brute-force limiter (the source requirements place
  # authentication policy in Nextcloud's hands), so this route MUST NOT gain an application-level rate
  # limiter, login challenge, or CAPTCHA -- that would be the parallel authentication system the
  # constitution forbids.
  /public/evidence/{token}:
    get:
      tags: [Evidence]
      summary: Retrieve evidence through an unguessable public link token (unauthenticated)
      operationId: getPublicEvidenceByToken
      security: [] # unauthenticated by design; see the notes above
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
        - name: disposition
          in: query
          required: false
          description: >-
            FR-060. `inline` renders inline-safe media types (images, PDF, plain text) and downloads
            everything else; `attachment` always downloads.
          schema: { type: string, enum: [inline, attachment], default: inline }
      responses:
        '200':
          description: >-
            Evidence content. `Content-Type` is the stored media type when it is inline-safe and
            `application/octet-stream` otherwise; `Content-Disposition` follows `disposition`.
          content:
            'application/octet-stream':
              schema: { type: string, format: binary }
            'application/pdf':
              schema: { type: string, format: binary }
            'image/png':
              schema: { type: string, format: binary }
            'image/jpeg':
              schema: { type: string, format: binary }
            'image/gif':
              schema: { type: string, format: binary }
            'image/webp':
              schema: { type: string, format: binary }
            'image/bmp':
              schema: { type: string, format: binary }
            'text/plain':
              schema: { type: string, format: binary }
        '404':
          # FR-031: unknown, deactivated and expired tokens are **indistinguishable by design**.
          # The generic `NotFound` response is the correct shape here precisely because it carries no
          # detail beyond the resource being absent -- a bespoke body would tempt an implementation into
          # disclosing *which* of the three cases applied, which would confirm that a link once existed.
          $ref: '#/components/responses/NotFound'

  /reports/{reportType}:
    get:
      tags: [Reports]
      summary: Return a role-scoped paged report
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum: [sheets, transactions, cost-centers, accounts, process, evidence, audit]
        - name: filters
          in: query
          # `type: string`, not an object, because a query parameter is a string: the filter object is
          # JSON-encoded into this **one** parameter. The description previously said "encoded as query
          # parameters by the client", which is a different wire shape -- one parameter per facet -- and
          # would have led a generated client to send `?statuses[]=OPEN`, which the server cannot read.
          # Each controller owns how its own transport encodes the value and hands the decoded object to one
          # `ReportFilterFactory`; the vocabulary is shared, the encoding is not.
          description: >-
            The report filter object, JSON-encoded into this single query parameter. The accepted keys are
            `ReportFilters`; an unrecognised key is refused with `422` rather than ignored. A `filters` value
            that is not decodable JSON, or that decodes to a list rather than an object, is refused with
            `422` too -- treating it as no filter at all would answer with the unfiltered report.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Report projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        # T374. Declared because the filter object is a **closed** vocabulary: the server refuses an
        # unrecognised, wrongly-typed, or mutually exclusive filter with a 422, and a client reading this
        # document had no way to know that. The message names the offending key and, for an unknown one, the
        # accepted list -- so the caller learns which filter to change rather than only that something was
        # wrong.
        '422':
          $ref: '#/components/responses/FilterRejected'

  /exports:
    post:
      tags: [Exports]
      summary: Generate and stream a role-scoped export
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          # An OCS envelope, not a bare artifact body. Every route in this `ocs` section is
          # wrapped by `OCSMiddleware` in a `V2Response`, so a response whose body is the raw
          # CSV/XLSX/PDF/ZIP bytes is unreachable from here. `mediaType` names the artifact's
          # real type and `data` carries its base64-encoded bytes.
          description: Generated export, encoded inside the OCS envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResult' }
        '422':
          # T374: the export reads the same closed `ReportFilters` vocabulary as `GET /reports`, decoded
          # from the JSON body rather than from a query parameter. It gets the same declared refusal
          # because it is the same rule -- not because the two endpoints happen to agree today.
          $ref: '#/components/responses/FilterRejected'

components:
  securitySchemes:
    nextcloudSession:
      type: apiKey
      in: cookie
      name: session
      description: Existing authenticated Nextcloud browser session and standard request token

  parameters:
    CommandId:
      name: X-PettyCash-Command-ID
      in: header
      required: true
      description: Client-generated UUID used for idempotent command replay
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CurrencyId:
      name: currencyId
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 3 }
    CostCenterId:
      name: costCenterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExpenseTypeId:
      name: expenseTypeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SheetId:
      name: sheetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HolderUid:
      name: holderUid
      in: path
      required: true
      description: A user who owns at least one petty-cash account
      schema: { type: string, minLength: 1 }

  responses:
    # Every response below carries `ocs.data.error` — the `ErrorEnvelope` wrapper, not `Error`
    # itself. The wrapper is what makes an OCS-200-that-carries-a-failure distinguishable from a
    # success payload: the OCS protocol permits a failure to arrive with HTTP 200, and a body of
    # `{code, message}` in `ocs.data` is a shape a success payload could also take, whereas a
    # present `error` key is a declared one. T334.
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The caller lacks role, ownership, scope, stage, or state authority
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource does not exist or is intentionally hidden from the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Stale version, duplicate/conflicting command, invalid state, or concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Business validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    # T374. Separate from the generic `ValidationError` because the *reason* is documented rather than the
    # status: the filter vocabulary is closed, so a 422 here specifically means the request named a filter
    # the server does not accept, gave one the wrong shape, or combined two that are mutually exclusive --
    # and the message names the offending key so the caller can correct it. A client that only knew
    # "validation failed" would not know that an unknown filter is refused rather than dropped, which is
    # precisely the assumption that produces a silently unfiltered report.
    FilterRejected:
      description: >-
        The filter object was refused: an unrecognised key (naming the accepted list), a key of the wrong
        shape, or `period` together with `from`/`to`. Refused rather than ignored, because ignoring an
        unrecognised filter returns the unfiltered report and the caller cannot tell that apart from a
        filter that matched everything.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CurrencyPage:
      description: Paged currencies
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Currency' } }
    CostCenterPage:
      description: Paged cost centers
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CostCenter' } }
    ExpenseTypePage:
      description: Paged expense types
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ExpenseType' } }
    AccountPage:
      description: Paged accounts
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Account' } }
    MovementPage:
      description: Paged account movements
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Movement' } }
    SheetPage:
      description: Paged sheet summaries
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
