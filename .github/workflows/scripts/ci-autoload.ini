; Activate the CI Composer-loader shim for every PHP SAPI.
;
; Loaded from /usr/local/etc/php/conf.d, which the image scans after the main php.ini, so
; `auto_prepend_file` applies to Apache's mod_php, the CLI SAPI, and cron.php alike.
;
; Why a prepend file rather than a wrapper: the autoloader conflict this addresses is created
; inside Nextcloud's own bootstrap (lib/base.php) and inside every app's registerAutoloading()
; call. A wrapper script can only change how a command is invoked, so it would leave real HTTP
; requests and the tests that make them on the broken ordering. An ini setting is the only
; place that reaches all of them without editing a single call site.
;
; See core-autoload-shim.php for what the shim does, why it is safe, and why the underlying
; application defect is not fixed here.
auto_prepend_file = /usr/local/share/pettycash-ci-shim/core-autoload-shim.php
